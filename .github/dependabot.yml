version: 2

updates:
  # Dependencias NuGet de todos los proyectos de la solución.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencias
      - seguridad
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Agrupa la familia de health checks: sus paquetes se versionan
      # juntos y actualizarlos por separado genera conflictos.
      healthchecks:
        patterns:
          - "AspNetCore.HealthChecks.*"
      mongodb:
        patterns:
          - "MongoDB.*"

  # Las propias acciones de GitHub Actions también se quedan obsoletas
  # y son parte de la cadena de suministro del pipeline.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencias
      - ci
    commit-message:
      prefix: "chore(ci)"
